name: Validate, build, and release

on:
  push:
    branches:
      - main
    paths:
      - "module.json"
      - "scripts/**"
      - "styles/**"
      - "templates/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate and package Roll Director
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate manifest and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/roll-director.js
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
          if (manifest.id !== "roll-director") throw new Error("module.json id must be roll-director");
          if (!/^\d+\.\d+\.\d+/.test(manifest.version)) throw new Error("Invalid module version");
          for (const path of [...(manifest.esmodules ?? []), ...(manifest.styles ?? [])]) {
            if (!fs.existsSync(path)) throw new Error(`Manifest file not found: ${path}`);
          }
          for (const path of ["README.md", "CHANGELOG.md", "scripts/roll-director.js", "styles/roll-director.css",
            "templates/diagnostics.hbs", "templates/favorite-tools.hbs", "templates/manager.hbs",
            "templates/open-manager.hbs", "templates/prompt.hbs"]) {
            if (!fs.existsSync(path)) throw new Error(`Required source file not found: ${path}`);
          }
          console.log(`Validated Roll Director v${manifest.version}`);
          NODE

      - name: Determine whether a release is required
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("module.json", "utf8")).version)')"
          previous_version=""
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$zero_sha" ]] &&
             git cat-file -e "${BEFORE_SHA}:module.json" 2>/dev/null; then
            previous_version="$(git show "${BEFORE_SHA}:module.json" | node --input-type=module -e 'let input = ""; for await (const chunk of process.stdin) input += chunk; console.log(JSON.parse(input).version)')"
          fi

          tag="v${version}"
          tag_exists=false
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
          fi

          create_release=false
          if [[ "$EVENT_NAME" == "push" && ( "$version" != "$previous_version" || "$tag_exists" == "false" ) ]]; then
            create_release=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "create_release=$create_release" >> "$GITHUB_OUTPUT"
          echo "Current version: $version"
          echo "Previous version: ${previous_version:-<none>}"
          echo "Release tag exists: $tag_exists"
          echo "Create release: $create_release"

      - name: Build Foundry module ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/roll-director
          cp module.json README.md CHANGELOG.md dist/roll-director/
          cp -a scripts styles templates dist/roll-director/
          cd dist
          zip -qr module.zip roll-director
          cp roll-director/module.json module.json
          unzip -l module.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: roll-director-${{ steps.release.outputs.version }}-build-${{ github.run_number }}
          path: dist/module.zip
          if-no-files-found: error
          retention-days: 30

      - name: Confirm release tag is unused
        if: steps.release.outputs.create_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Increment version in module.json before publishing." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: steps.release.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/module.json dist/module.zip \
            --target "$GITHUB_SHA" \
            --title "Roll Director v${VERSION}" \
            --generate-notes
