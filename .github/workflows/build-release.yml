name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'module.json'
      - 'scripts/**'
      - 'styles/**'
      - 'templates/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate module manifest and JavaScript
        run: |
          node -e "const m=require('./module.json'); if (!m.id || !m.version) process.exit(1); console.log(m.id + ' v' + m.version)"
          node --check scripts/roll-director.js

      - name: Package module
        run: |
          mkdir -p dist
          zip -r dist/module.zip module.json scripts styles templates README.md CHANGELOG.md
          cp module.json dist/module.json

      - name: Create or update version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/module.json dist/module.zip --clobber
          else
            gh release create "${TAG}" dist/module.json dist/module.zip \
              --title "Roll Director ${TAG}" \
              --notes "Roll Director ${TAG}"
          fi
